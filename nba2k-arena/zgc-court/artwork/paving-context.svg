<title>R10 grey cement garden paving and retained R09 fence-apron continuation</title>
<desc>100 units per metre, source x=100*worldX+1432.56, source y=762-100*worldY. court.svg is inserted by the rasterizer at its original coordinates and clips only its central 28.6512 by 15.24 m image. These wider paving paths continue matching grey/cream regions across the apron and join the garden paving without ending at the gameplay rectangle. R10 atlas returns to the uniform 949994 grey-cement base at its outer guard. Base and curves are darker with restrained contrast; fine vector mineral aggregate is a plausible material reconstruction, not a photograph-projected texture. R09 extends only black/white perimeter paint to the existing fence centre lines (world X=-16.08, Y=+/-9.17), based on refs07/17/18. Yellow NBA edge and central artwork scale are unchanged. The nearby pedestrian strip is warm grey stone. Colours and occluded continuation are reconstruction estimates, not surveyed reflectance. No new geometry is implied.</desc>
